<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <!-- App Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Wheat / Produce Sheaf Emblem -->
  <g transform="translate(256, 230)">
    <!-- Central Stalk -->
    <path d="M0,140 Q-5,0 0,-130" stroke="#fef08a" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Golden Wheat Grains -->
    <!-- Left Grains -->
    <path d="M-8,-90 C-35,-105 -50,-80 -12,-70 Z" fill="url(#gold)"/>
    <path d="M-10,-50 C-45,-65 -60,-40 -14,-30 Z" fill="url(#gold)"/>
    <path d="M-12,-10 C-50,-25 -65,0 -16,10 Z" fill="url(#gold)"/>
    <path d="M-10,30 C-45,15 -60,40 -14,50 Z" fill="url(#gold)"/>
    
    <!-- Right Grains -->
    <path d="M8,-90 C35,-105 50,-80 12,-70 Z" fill="url(#gold)"/>
    <path d="M10,-50 C45,-65 60,-40 14,-30 Z" fill="url(#gold)"/>
    <path d="M12,-10 C50,-25 65,0 16,10 Z" fill="url(#gold)"/>
    <path d="M10,30 C45,15 60,40 14,50 Z" fill="url(#gold)"/>
    
    <!-- Top Grain -->
    <path d="M0,-140 C-15,-170 15,-170 0,-140 Z" fill="#fef08a"/>
    
    <!-- Natural Sprout Leaves -->
    <path d="M-10,80 C-80,60 -100,120 -15,105 Z" fill="url(#leaf)"/>
    <path d="M10,80 C80,60 100,120 15,105 Z" fill="url(#leaf)"/>
  </g>
  
  <!-- Delivery Speed Badge Base -->
  <g transform="translate(256, 420)">
    <rect x="-170" y="-34" width="340" height="68" rx="34" fill="#042f2e" stroke="#10b981" stroke-width="3"/>
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ecfdf5" text-anchor="middle" letter-spacing="2">KISAN DIRECT</text>
  </g>
</svg>
